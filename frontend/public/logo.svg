<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gt-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#583AFF"/>
      <stop offset="100%" stop-color="#00CEFF"/>
    </linearGradient>
    <linearGradient id="gt-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCFFFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#gt-brand)"/>

  <!-- Outer target ring -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#gt-ring)" stroke-width="36" stroke-linecap="round"/>
  <!-- Inner target ring -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <!-- Centre dot (aim) -->
  <circle cx="256" cy="256" r="18" fill="#FFFFFF"/>

  <!-- Cross ticks (aim lines) -->
  <g stroke="#FFFFFF" stroke-width="34" stroke-linecap="round">
    <line x1="256" y1="44"  x2="256" y2="132"/>
    <line x1="256" y1="380" x2="256" y2="468"/>
    <line x1="44"  y1="256" x2="132" y2="256"/>
    <line x1="380" y1="256" x2="468" y2="256"/>
  </g>

  <!-- Bold trigger pull line (diagonal) -->
  <line x1="212" y1="296" x2="300" y2="216" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>

  <!-- Subtle play/action triangle toward the inner ring -->
  <polygon points="231,220 231,292 296,256" fill="#21102A"/>
</svg>
